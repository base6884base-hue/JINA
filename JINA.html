<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JINA — Жеке қаржы</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fa;color:#222}
header{background:#111;color:white;padding:18px;text-align:center;font-size:22px;font-weight:bold}
nav{display:flex;overflow:auto;background:white;border-bottom:1px solid #ddd}
nav button{border:0;background:white;padding:14px 12px;font-size:14px;white-space:nowrap}
nav button.active{color:#1677ff;font-weight:bold;border-bottom:2px solid #1677ff}
main{padding:15px;max-width:650px;margin:auto}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #ddd}
h2{margin-top:5px}.money{font-size:25px;font-weight:bold}
button{border:0;border-radius:10px;padding:9px 12px;margin:3px;background:#eee}
.add{background:#1677ff;color:white}.del{background:#ffe5e5;color:#d00}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.deposit{background:#f7f8fb;padding:10px;border-radius:10px;margin-top:7px}
.small{font-size:13px;color:#777}
</style>
</head>
<body>
<header>JINA 💰 Жеке қаржы</header>
<nav>
<button onclick="show('home')" id="nh">Басты</button>
<button onclick="show('income')" id="ni">Кірістер</button>
<button onclick="show('expense')" id="ne">Шығыстар</button>
<button onclick="show('plan')" id="np">Жоспар</button>
<button onclick="show('save')" id="ns">Жинақ</button>
</nav>
<main id="app"></main>
<script>
const KEY="jina_v3";
let db=JSON.parse(localStorage.getItem(KEY)||'{"incomes":[],"expenses":[],"plans":[],"savings":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return Number(n||0).toLocaleString('kk-KZ')+" ₸"}
function id(){return Date.now()+Math.random()}
function esc(x){return String(x||'').replace(/</g,'&lt;')}
function show(p){
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
 document.getElementById({home:'nh',income:'ni',expense:'ne',plan:'np',save:'ns'}[p]).classList.add('active');
 if(p=='home')home();if(p=='income')income();if(p=='expense')expense();if(p=='plan')plan();if(p=='save')savings();
}
function totalIncome(){return db.incomes.reduce((a,s)=>a+s.deposits.reduce((x,d)=>x+ +d.amount,0),0)}
function totalExpense(){return db.expenses.reduce((a,e)=>a+ +e.amount,0)}
function sourceTotal(s){return s.deposits.reduce((a,d)=>a+ +d.amount,0)}
function spent(id){return db.expenses.filter(e=>e.sourceId==id).reduce((a,e)=>a+ +e.amount,0)}
function home(){
 app.innerHTML=`<div class="card"><h2>💰 Баланс</h2><div class="money">${money(totalIncome()-totalExpense())}</div>
 <p>Кіріс: ${money(totalIncome())}</p><p>Шығыс: ${money(totalExpense())}</p></div>`;
}
function income(){
 app.innerHTML=`<div class="card"><div class="row"><h2>Кірістер</h2><button class="add" onclick="newSource()">＋ Кіріс</button></div></div>`+
 db.incomes.map(s=>`<div class="card">
 <div class="row"><div><b>${esc(s.name)}</b><div class="money">${money(sourceTotal(s))}</div></div>
 <div><button onclick="rename('${s.id}')">✏️</button><button class="del" onclick="delSource('${s.id}')">🗑️</button></div></div>
 <p class="small">Қалды: ${money(sourceTotal(s)-spent(s.id))}</p>
 <button class="add" onclick="addDeposit('${s.id}')">＋ Ақша қосу</button>
 ${s.deposits.map(d=>`<div class="deposit"><b>+${money(d.amount)}</b><br><span class="small">${d.date||''} ${esc(d.comment)}</span>
 <br><button onclick="editDeposit('${s.id}','${d.id}')">✏️</button><button class="del" onclick="delDeposit('${s.id}','${d.id}')">🗑️</button></div>`).join('')}
 </div>`).join('');
}
function newSource(){
 let name=prompt("Кіріс көзі / адам аты:");
 if(!name)return;
 let amount=prompt("Алғашқы ақша:");
 if(amount===null)return;
 db.incomes.push({id:id(),name,deposits:[{id:id(),amount:+amount,date:new Date().toISOString().slice(0,10),comment:""}]});
 save();income();
}
function addDeposit(sid){
 let a=prompt("Қосылатын ақша:");
 if(a===null)return;
 let date=prompt("Күні (YYYY-MM-DD):",new Date().toISOString().slice(0,10));
 let c=prompt("Комментарий:");
 let s=db.incomes.find(x=>x.id==sid);
 s.deposits.push({id:id(),amount:+a,date,comment:c||""});save();income();
}
function editDeposit(sid,did){
 let s=db.incomes.find(x=>x.id==sid),d=s.deposits.find(x=>x.id==did);
 let a=prompt("Сома:",d.amount);if(a===null)return;
 let date=prompt("Күні:",d.date),c=prompt("Комментарий:",d.comment);
 d.amount=+a;d.date=date;d.comment=c||"";save();income();
}
function delDeposit(sid,did){
 if(!confirm("Өшіру керек пе?"))return;
 let s=db.incomes.find(x=>x.id==sid);s.deposits=s.deposits.filter(d=>d.id!=did);save();income();
}
function rename(sid){
 let s=db.incomes.find(x=>x.id==sid),n=prompt("Аты:",s.name);
 if(n){s.name=n;save();income()}
}
function delSource(sid){
 if(db.expenses.some(e=>e.sourceId==sid)){alert("Бұл кіріске шығыс байланысқан.");return}
 if(confirm("Кірісті өшіру керек пе?")){db.incomes=db.incomes.filter(s=>s.id!=sid);save();income()}
}
function expense(){
 app.innerHTML=`<div class="card"><div class="row"><h2>Шығыстар</h2><button class="add" onclick="newExpense()">＋</button></div></div>`+
 db.expenses.map(e=>`<div class="card"><b>${money(e.amount)}</b> — ${esc(e.name)}
 <div class="small">${e.date||''} ${esc(e.comment)}</div>
 <button onclick="editExpense('${e.id}')">✏️</button><button class="del" onclick="delExpense('${e.id}')">🗑️</button></div>`).join('');
}
function newExpense(){
 let s=db.incomes.map(x=>`${x.id}|${x.name}`).join('\n');
 let sid=prompt("Кіріс көзі ID:\n"+s);if(!sid)return;
 let a=prompt("Шығын сомасы:");if(a===null)return;
 let n=prompt("Не үшін?"),d=prompt("Күні:",new Date().toISOString().slice(0,10)),c=prompt("Комментарий:");
 db.expenses.push({id:id(),sourceId:sid,amount:+a,name:n||"",date:d,comment:c||""});save();expense();
}
function editExpense(i){
 let e=db.expenses.find(x=>x.id==i),a=prompt("Сома:",e.amount);if(a===null)return;
 e.amount=+a;e.name=prompt("Не үшін:",e.name)||"";e.date=prompt("Күні:",e.date);e.comment=prompt("Комментарий:",e.comment)||"";save();expense();
}
function delExpense(i){if(confirm("Өшіру керек пе?")){db.expenses=db.expenses.filter(e=>e.id!=i);save();expense()}}
function plan(){
 app.innerHTML=`<div class="card"><div class="row"><h2>Жоспар</h2><button class="add" onclick="newPlan()">＋</button></div></div>`+
 db.plans.map(x=>`<div class="card"><b>${esc(x.name)}</b> — ${money(x.amount)}
 <div class="small">${x.date||''} ${esc(x.comment)}</div>
 <button onclick="editPlan('${x.id}')">✏️</button><button class="del" onclick="delPlan('${x.id}')">🗑️</button></div>`).join('');
}
function newPlan(){
 let n=prompt("Жоспар:"),a=prompt("Сома:");if(!n||a===null)return;
 db.plans.push({id:id(),name:n,amount:+a,date:prompt("Күні:",new Date().toISOString().slice(0,10)),comment:prompt("Комментарий:")||""});save();plan();
}
function editPlan(i){
 let x=db.plans.find(x=>x.id==i);x.name=prompt("Жоспар:",x.name)||"";x.amount=+prompt("Сома:",x.amount);x.date=prompt("Күні:",x.date);x.comment=prompt("Комментарий:",x.comment)||"";save();plan();
}
function delPlan(i){if(confirm("Өшіру керек пе?")){db.plans=db.plans.filter(x=>x.id!=i);save();plan()}}
function savings(){
 app.innerHTML=`<div class="card"><div class="row"><h2>Жинақ</h2><button class="add" onclick="newSave()">＋</button></div></div>`+
 db.savings.map(x=>`<div class="card"><b>${esc(x.name)}</b> — ${money(x.amount)}
 <div class="small">${x.date||''} ${esc(x.comment)}</div>
 <button onclick="editSave('${x.id}')">✏️</button><button class="del" onclick="delSave('${x.id}')">🗑️</button></div>`).join('');
}
function newSave(){
 let n=prompt("Жинақ атауы:"),a=prompt("Сома:");if(!n||a===null)return;
 db.savings.push({id:id(),name:n,amount:+a,date:prompt("Күні:",new Date().toISOString().slice(0,10)),comment:prompt("Комментарий:")||""});save();savings();
}
function editSave(i){
 let x=db.savings.find(x=>x.id==i);x.name=prompt("Атауы:",x.name)||"";x.amount=+prompt("Сома:",x.amount);x.date=prompt("Күні:",x.date);x.comment=prompt("Комментарий:",x.comment)||"";save();savings();
}
function delSave(i){if(confirm("Өшіру керек пе?")){db.savings=db.savings.filter(x=>x.id!=i);save();savings()}}
show('home');
</script>
</body>
</html>
